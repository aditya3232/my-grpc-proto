name: Push - Create & Tag Protobuf - Go

on:
  push:
    branches:
      - "master"
      - "main"

# Cegah dua run bersamaan berebut commit/tag yang sama
concurrency:
  group: protobuf-go-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-protobuf-go:
    runs-on: ubuntu-24.04 # dipin supaya tidak ikut pindah ke Ubuntu 26 otomatis
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} # github.head_ref kosong di event push
          fetch-depth: 0 # butuh history & tag penuh untuk bump versi

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - name: Generate Go Source
        shell: bash
        run: |
          make pipeline-build

      - name: Generate Go Gateway source
        shell: bash
        run: |
          make pipeline-build-gateway

      - name: Commit generated files
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(protobuf-go): Auto-generated by GitHub Action'
          file_pattern: 'protogen/*'
          # tagging_message dihapus: output tag_version belum ada di step ini

      - name: Bump version and push tag
        id: tag_version
        uses: anothrNick/github-tag-action@1.61.0 # cek rilis terbaru di repo action-nya
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch